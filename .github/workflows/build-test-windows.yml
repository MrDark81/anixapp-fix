
name: Windows Test Build

on:
  # Проверять ветки при отправке изменений,
  # в том числе до создания Pull Request.
  push:
    branches:
      - '**'

  # Также разрешить ручной запуск.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Checks and Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run static checks
        run: yarn check

      - name: Build Windows installer
        run: yarn build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ANIXART_PROXY_APP_KEY: ${{ secrets.ANIXART_PROXY_APP_KEY }}
          ANIXBACK_PROXY_TARGET: ${{ secrets.ANIXBACK_PROXY_TARGET }}

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AnixApp-Windows-Test-${{ github.run_number }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
