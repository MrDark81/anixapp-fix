name: Windows Test Build

on:
  # Automatically build every pushed branch, including test-windows.
  push:
    branches:
      - '**'

  # Available for manual dispatch once this workflow exists on the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Checks and Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        id: install-dependencies
        run: yarn install --frozen-lockfile

      # Use Svelte-check's supported TypeScript 7 mode (TypeScript 6 API + TS7 native CLI).
      # Keep diagnostics visible while allowing a test installer to be built.
      - name: Run Svelte and TypeScript checks
        id: svelte_check
        continue-on-error: true
        run: yarn run svelte-check --tsconfig ./tsconfig.json --tsgo

      - name: Run ESLint, Stylelint and encoding check
        id: lint
        continue-on-error: true
        run: yarn run lint

      - name: Build Windows test installer
        id: build-windows
        if: steps.install-dependencies.outcome == 'success'
        run: yarn build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ANIXART_PROXY_APP_KEY: ${{ secrets.ANIXART_PROXY_APP_KEY }}
          ANIXBACK_PROXY_TARGET: ${{ secrets.ANIXBACK_PROXY_TARGET }}
          # Test builds may omit OAuth/proxy secrets; those features won't work
          # unless the real repository secrets are configured.
          ANIXAPP_TEST_BUILD: '1'

      - name: Upload Windows build
        if: steps.build-windows.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnixApp-Windows-Test-${{ github.run_number }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Mark run failed if static checks failed
        if: always() && (steps.svelte_check.outcome == 'failure' || steps.lint.outcome == 'failure')
        shell: pwsh
        run: |
          Write-Error "One or more static checks failed. Review the check steps. The test build was still attempted."
